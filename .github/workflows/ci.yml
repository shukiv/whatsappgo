name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  daemon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.x'
          cache: true
      - run: go test -race ./...
      - run: go vet ./...
      - run: CGO_ENABLED=0 go build -trimpath -o bin/whatsappd ./cmd/whatsappd
      - run: CGO_ENABLED=0 go build -trimpath -o bin/whatsappctl ./cmd/whatsappctl

  cross:
    # The desktop client runs on three platforms, so the daemon has to keep
    # compiling for all three. This is the job that catches a Linux-only call
    # added without a build tag, which is otherwise invisible until someone
    # tries to build on Windows.
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: windows
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: darwin
            goarch: amd64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.x'
          cache: true
      - run: CGO_ENABLED=0 GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} go build -o /dev/null ./...
      - run: GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} go vet ./...

  desktop:
    runs-on: ubuntu-latest
    container: fedora:latest
    steps:
      - run: dnf -y install git cmake ninja-build gcc-c++ qt6-qtbase-devel qt6-qtdeclarative-devel qt6-qtmultimedia-devel
      - uses: actions/checkout@v4
      - run: cmake -S desktop -B desktop/build -G Ninja -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build desktop/build --parallel

  desktop-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.x'
          cache: true
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.2'
          modules: 'qtmultimedia'
      - run: go build -trimpath -o bin/whatsappd.exe ./cmd/whatsappd
        env:
          CGO_ENABLED: '0'
      - run: go build -trimpath -o bin/whatsappctl.exe ./cmd/whatsappctl
        env:
          CGO_ENABLED: '0'
      - run: cmake -S desktop -B desktop/build -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build desktop/build --config Release --parallel
      - run: ctest --test-dir desktop/build -C Release --output-on-failure

  desktop-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.x'
          cache: true
      # Qt before 6.8.4 links the AGL framework, which Apple removed from the
      # macOS SDK: every link fails with "ld: framework 'AGL' not found".
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.4'
          modules: 'qtmultimedia'
      - run: CGO_ENABLED=0 go build -trimpath -o bin/whatsappd ./cmd/whatsappd
      - run: CGO_ENABLED=0 go build -trimpath -o bin/whatsappctl ./cmd/whatsappctl
      - run: cmake -S desktop -B desktop/build -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build desktop/build --parallel
      - run: ctest --test-dir desktop/build --output-on-failure
