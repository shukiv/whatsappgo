name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  daemon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.x'
          cache: true
      - run: go test -race ./...
      - run: go vet ./...
      - run: CGO_ENABLED=0 go build -trimpath -o bin/whatsappd ./cmd/whatsappd
      - run: CGO_ENABLED=0 go build -trimpath -o bin/whatsappctl ./cmd/whatsappctl

  cross:
    # The desktop client runs on three platforms, so the daemon has to keep
    # compiling for all three. This is the job that catches a Linux-only call
    # added without a build tag, which is otherwise invisible until someone
    # tries to build on Windows.
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: windows
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: darwin
            goarch: amd64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.x'
          cache: true
      - run: CGO_ENABLED=0 GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} go build -o /dev/null ./...
      - run: GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} go vet ./...

  desktop:
    runs-on: ubuntu-latest
    container: fedora:latest
    timeout-minutes: 45
    env:
      # Fedora builds Qt with the journald logging backend, so qWarning output
      # goes to a journal this container does not have: 21 of 35 tests failed
      # here with completely empty output.
      QT_FORCE_STDERR_LOGGING: '1'
    steps:
      # fontconfig on a bare container has no fonts to hand Qt, and the tests
      # that measure text are the ones that fail.
      # libwebp-devel is what decodes an animated sticker: without it the
      # build falls back to saying they are unavailable, which is what every
      # published build did.
      - run: dnf -y install git cmake ninja-build gcc-c++ qt6-qtbase-devel qt6-qtdeclarative-devel qt6-qtmultimedia-devel qt6-qtsvg-devel qt6-qtquickcontrols2 libwebp-devel fontconfig google-noto-sans-fonts dejavu-sans-fonts
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.x'
          cache: true
      # The container checks the repository out under a different owner than
      # the build user, so git refuses to describe it and `go build` stops with
      # "error obtaining VCS status: exit status 128".
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      # desktop-backend-lifecycle starts the real daemon, so it has to exist
      # before the desktop build copies it beside the application.
      - run: CGO_ENABLED=0 go build -trimpath -o bin/whatsappd ./cmd/whatsappd
      - run: CGO_ENABLED=0 go build -trimpath -o bin/whatsappctl ./cmd/whatsappctl
      - run: ./scripts/build-jobs-test.sh
      - run: ./scripts/version-test.sh
      - run: cmake -S desktop -B desktop/build -G Ninja -DCMAKE_BUILD_TYPE=Release -DWHATSAPPGO_REQUIRE_WEBP=ON
      - run: cmake --build desktop/build --parallel "$(./scripts/build-jobs.sh)"
      # This job built the desktop application for months without ever running
      # its tests, which is how a Linux-only assumption reached the Windows and
      # macOS jobs unnoticed.
      - run: ctest --test-dir desktop/build --output-on-failure
      # A build without libwebp has to show a still sticker and start no
      # decoder. That path was only ever reached by a machine that happened to
      # lack the library - the Windows job, where it had been wrong for as long
      # as it existed and nobody was running the test. It is built here on
      # purpose instead.
      - run: cmake -S desktop -B desktop/build-nowebp -G Ninja -DCMAKE_BUILD_TYPE=Release -DWHATSAPPGO_DISABLE_WEBP=ON
      - run: cmake --build desktop/build-nowebp --parallel "$(./scripts/build-jobs.sh)"
      - run: ctest --test-dir desktop/build-nowebp -R desktop-sticker --output-on-failure

  desktop-windows:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      # Qt's default message handler on Windows sends output to the debugger
      # unless it is certain a console is attached, which is why a failing test
      # printed nothing at all under ctest.
      QT_FORCE_STDERR_LOGGING: '1'
      QT_ASSUME_STDERR_HAS_CONSOLE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.x'
          cache: true
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.9.3'
          modules: 'qtmultimedia'
      - run: go build -trimpath -o bin/whatsappd.exe ./cmd/whatsappd
        env:
          CGO_ENABLED: '0'
      - run: go build -trimpath -o bin/whatsappctl.exe ./cmd/whatsappctl
        env:
          CGO_ENABLED: '0'
      # The Linux and macOS jobs install libwebp; this one never did, so every
      # Windows build shipped with animated stickers switched off and the
      # sticker grid test failed here alone. The triplet is the static one
      # built against the shared runtime, which is the runtime Qt uses: it
      # leaves no DLL to deploy beside the application. It is a community
      # triplet, which vcpkg does not test, so a port update could break it;
      # the alternative ships three DLLs the packaging script would have to
      # carry itself. Called by path: the runner sets the variable but is not
      # documented to put vcpkg on PATH.
      - run: '& "$env:VCPKG_INSTALLATION_ROOT/vcpkg.exe" install libwebp:x64-windows-static-md'
      # REQUIRE_WEBP so a job that cannot find the library stops at
      # configuration with a sentence about it, rather than building a client
      # that quietly refuses animated stickers.
      - run: >
          cmake -S desktop -B desktop/build -DCMAKE_BUILD_TYPE=Release
          -DWHATSAPPGO_REQUIRE_WEBP=ON
          -DVCPKG_TARGET_TRIPLET=x64-windows-static-md
          "-DCMAKE_TOOLCHAIN_FILE=$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"
      - run: cmake --build desktop/build --config Release --parallel
      - run: ctest --test-dir desktop/build -C Release --output-on-failure
      # The packaging script is the only thing that runs windeployqt, so it is
      # also the only thing that proves the application ships with the Qt DLLs
      # and QML plugins it needs. Build it even when a test failed: a red suite
      # is still worth a binary someone can try.
      # The same libwebp the configure above was given: this script insists on
      # the library the way the AppImage and macOS scripts do, so without the
      # toolchain it stops at configuration even though the build beside it
      # just passed.
      - if: ${{ !cancelled() }}
        run: >
          powershell -ExecutionPolicy Bypass -File packaging/windows/build.ps1
          -ToolchainFile "$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"
          -Triplet x64-windows-static-md
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: whatsappgo-windows-x64
          path: build/WhatsAppGo-windows-x64.zip
          if-no-files-found: error

  desktop-macos:
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      # cmake reads this, so it also reaches the cmake calls inside
      # packaging/macos/build.sh. Without it the generator is Unix Makefiles,
      # and "cmake --build --parallel" passes make a bare -j: unlimited jobs on
      # a three-core runner, which took 30-50 minutes to build what ninja
      # builds in a few.
      CMAKE_GENERATOR: Ninja
    steps:
      - uses: actions/checkout@v4
      - run: command -v ninja >/dev/null || brew install ninja
      # libwebp decodes animated stickers; without it the sticker animation
      # test only proves the client says they are unavailable.
      - run: brew list webp >/dev/null 2>&1 || brew install webp
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.x'
          cache: true
      # Qt before 6.9.2 links the AGL framework, which Apple removed from the
      # macOS SDK: every link fails with "ld: framework 'AGL' not found".
      # 6.8.4 carries the same fix but was never published to the mirrors.
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.9.3'
          modules: 'qtmultimedia'
      - run: CGO_ENABLED=0 go build -trimpath -o bin/whatsappd ./cmd/whatsappd
      - run: CGO_ENABLED=0 go build -trimpath -o bin/whatsappctl ./cmd/whatsappctl
      - run: cmake -S desktop -B desktop/build -DCMAKE_BUILD_TYPE=Release -DWHATSAPPGO_REQUIRE_WEBP=ON
      - run: cmake --build desktop/build --parallel
      - run: ctest --test-dir desktop/build --output-on-failure
      # Same reasoning as the Windows job: macdeployqt runs nowhere else, so
      # nothing else proves the bundle carries its frameworks and QML plugins.
      # The build is unsigned here - no Developer ID is available to CI - so
      # Gatekeeper will refuse it on a machine that did not build it.
      - if: ${{ !cancelled() }}
        run: packaging/macos/build.sh
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: whatsappgo-macos
          path: build/macos/*.dmg
          if-no-files-found: error
