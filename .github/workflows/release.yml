name: Release

# Publishing is deliberately manual: pushing a v* tag, or running the workflow
# by hand. Nothing here fires on an ordinary push.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to publish (created if it does not exist)'
        required: true

permissions:
  contents: write

# This workflow does not run the test suite. CI runs it on every push, and a
# release is cut from a commit that has already been through it - gating here
# as well would only mean discovering a red suite after the tag exists.

env:
  QT_VERSION: '6.9.3'

jobs:
  draft:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - id: resolve
        run: echo "tag=${{ github.event.inputs.tag || github.ref_name }}" >> "$GITHUB_OUTPUT"
      # The release starts as a draft and stays one. Nothing is published to
      # people until a human looks at the binaries and presses the button:
      # these builds are unsigned, so they are worth a second look.
      - run: |
          gh release view "${{ steps.resolve.outputs.tag }}" >/dev/null 2>&1 && exit 0
          gh release create "${{ steps.resolve.outputs.tag }}" \
            --draft \
            --title "WhatsAppGo ${{ steps.resolve.outputs.tag }}" \
            --notes "Unsigned builds. macOS refuses an unsigned bundle from another machine until you allow it in System Settings, and Windows SmartScreen warns about an unsigned installer."
        env:
          GH_TOKEN: ${{ github.token }}

  linux:
    needs: draft
    runs-on: ubuntu-latest
    # The tag is the version the binaries call themselves. Without it they are
    # "dev" builds, which are never behind a release and never offer an update.
    env:
      WHATSAPPGO_VERSION: ${{ needs.draft.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.x'
          cache: true
      - uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          modules: 'qtmultimedia'
      - run: sudo apt-get update && sudo apt-get install -y libfuse2 libxcb-cursor0
      - run: packaging/appimage/build.sh
      - run: gh release upload "${{ needs.draft.outputs.tag }}" build/WhatsAppGo-*.AppImage --clobber
        env:
          GH_TOKEN: ${{ github.token }}

  windows:
    needs: draft
    runs-on: windows-latest
    env:
      WHATSAPPGO_VERSION: ${{ needs.draft.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.x'
          cache: true
      - uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          modules: 'qtmultimedia'
      - run: choco install innosetup --no-progress -y
      - run: powershell -ExecutionPolicy Bypass -File packaging/windows/build.ps1
      - run: gh release upload "${{ needs.draft.outputs.tag }}" build/WhatsAppGo-windows-x64.zip build/WhatsAppGo-Setup.exe --clobber
        env:
          GH_TOKEN: ${{ github.token }}

  macos:
    needs: draft
    strategy:
      fail-fast: false
      matrix:
        include:
          # macos-latest is Apple silicon; macos-13 is the last Intel image.
          - runner: macos-latest
          - runner: macos-13
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    env:
      WHATSAPPGO_VERSION: ${{ needs.draft.outputs.tag }}
      # Unix Makefiles plus "cmake --build --parallel" means a bare make -j on
      # a three-core runner, which turns a few minutes of work into most of an
      # hour. cmake picks the generator up from this variable.
      CMAKE_GENERATOR: Ninja
    steps:
      - uses: actions/checkout@v4
      - run: command -v ninja >/dev/null || brew install ninja
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.x'
          cache: true
      - uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          modules: 'qtmultimedia'
      - run: packaging/macos/build.sh
      - run: gh release upload "${{ needs.draft.outputs.tag }}" build/macos/*.dmg --clobber
        env:
          GH_TOKEN: ${{ github.token }}

  # The updater downloads an asset and refuses to install one whose checksum is
  # not in this file, so the file has to exist before anybody can update with a
  # click. It is written after the three builds have uploaded, from the assets
  # the release actually carries.
  checksums:
    needs: [draft, linux, windows, macos]
    runs-on: ubuntu-latest
    steps:
      - run: |
          mkdir -p dist
          gh release download "${{ needs.draft.outputs.tag }}" --repo "${{ github.repository }}" --dir dist --pattern '*' --clobber
          rm -f dist/SHA256SUMS
          cd dist && sha256sum * > SHA256SUMS
          cat SHA256SUMS
          gh release upload "${{ needs.draft.outputs.tag }}" SHA256SUMS --repo "${{ github.repository }}" --clobber
        env:
          GH_TOKEN: ${{ github.token }}
